[project]
name = "code-learning"
version = "0.1.0"
description = "Learn ML papers by implementing their core ideas, one small step at a time."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pytest>=8",
    "torch>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modules/engram/src/engram"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["modules"]
